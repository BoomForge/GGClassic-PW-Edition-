name: PW Edition Windows updater EXE (no engine binaries)
on:
  pull_request:
    paths:
      - "tools/PWBootstrapper/**"
      - ".github/workflows/pw-bootstrapper-exe.yml"
  push:
    branches:
      - work/pw-community-integration-20261121
    paths:
      - "tools/PWBootstrapper/**"
      - ".github/workflows/pw-bootstrapper-exe.yml"
  workflow_dispatch:
# This workflow publishes ONLY our own updater executable, never GameGuru engine
# binaries/media. Its public release provides a stable, unauthenticated channel
# so the in-editor updater can safely bootstrap future updater versions.
permissions:
  contents: write
jobs:
  bootstrapper:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile standalone Windows updater
        shell: pwsh
        run: |
          dotnet publish tools/PWBootstrapper/PWBootstrapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=none -o PWBootstrapper-dist
          if ($LASTEXITCODE -ne 0) { throw "Updater compilation failed" }
          if (-not (Test-Path 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.exe')) { throw "EXE missing" }
          Get-FileHash 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.exe' -Algorithm SHA256 | Format-List
      - name: Publish updater EXE as workflow artifact (no GameGuru executables)
        uses: actions/upload-artifact@v4
        with:
          name: Pixelwolf-GGC-Updater-Win64
          path: PWBootstrapper-dist/Pixelwolf-GGC-Updater.exe
          if-no-files-found: error
          retention-days: 30

      - name: Prepare SHA-256 checksum for independent updater release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $exe = 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.sha256' -Value "$hash  Pixelwolf-GGC-Updater.exe" -Encoding Ascii
      - name: Publish publicly downloadable updater-only channel
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'pw-updater-dev'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'PW Edition development updater (no GameGuru binaries)' --notes 'Self-contained open-source updater only. Licensed owners compile their own GameGuru editor from source.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create updater-only release' }
          }
          gh release upload $tag 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.exe' 'PWBootstrapper-dist/Pixelwolf-GGC-Updater.sha256' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish updater/checksum release assets' }
