name: PW Edition skeletal importer audit
on:
  push:
    branches:
      - work/pw-community-integration-20261121
    paths:
      - "GameGuru Core/GameGuru/Include/PW-AssetManifest.h"
      - "GameGuru Core/GameGuru/Source/M-Importer.cpp"
      - "tools/test_pw_asset_manifest.cpp"
      - ".github/workflows/pw-skeletal-audit-validation.yml"
  pull_request:
    paths:
      - "GameGuru Core/GameGuru/Include/PW-SkeletalAudit.h"
      - "GameGuru Core/GameGuru/Include/PW-AssetManifest.h"
      - "GameGuru Core/GameGuru/Source/M-Importer.cpp"
      - "tools/test_pw_asset_manifest.cpp"
      - "tools/test_pw_skeletal_audit.cpp"
      - "tools/test_pw_skeletal_integrity.cpp"
      - "GameGuru Core/GameGuru/Include/PW-SkeletalIntegrity.h"
      - ".github/workflows/pw-skeletal-audit-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skeletal-audit:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Windows skeletal audit test
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'VS2022 installation not found' }
          $vcvars = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = 'call "' + $vcvars + '" -arch=x64 >nul && cl.exe /nologo /EHsc /W4 /std:c++14 /I "GameGuru Core\GameGuru\Include" tools\test_pw_skeletal_audit.cpp /Fe:pw-skeletal-audit.exe && pw-skeletal-audit.exe && cl.exe /nologo /EHsc /W4 /std:c++14 /I "GameGuru Core\GameGuru\Include" tools\test_pw_skeletal_integrity.cpp /Fe:pw-skeletal-integrity.exe && pw-skeletal-integrity.exe && cl.exe /nologo /EHsc /W4 /std:c++14 /I "GameGuru Core\GameGuru\Include" tools\test_pw_asset_manifest.cpp /Fe:pw-asset-manifest.exe && pw-asset-manifest.exe'
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Skeletal import audit test failed' }
      - name: Parse Model Importer 2 manifest with a real JSON reader
        shell: pwsh
        run: |
          python -c "import json; m=json.load(open('pw-asset-preflight-test.json', encoding='utf-8')); assert m['schema']=='pw.asset-preflight'; assert m['version']==1; assert m['unresolvedTextures']==1; assert m['frames'][1]['name']=='Head\\\\\\\"Bone'; assert m['clips'][0]['name']=='Idle'; print('Importer 2 JSON schema PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Importer 2 JSON schema parse failed' }

