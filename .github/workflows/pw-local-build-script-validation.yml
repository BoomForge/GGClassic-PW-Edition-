name: PW Edition local build script syntax
on:
  pull_request:
    paths:
      - "tools/pw-local-test.ps1"
      - "tools/pw-prepare-d3dx.ps1"
      - "tools/pw-prepare-steam-imports.ps1"
      - "tools/steam-api64.def"
      - "tools/sdkencryptedappticket64.def"
      - "START_PW_TEST_BUILD.cmd"
      - ".github/workflows/pw-local-build-script-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-script:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without running or copying Steam files
        shell: pwsh
        run: |
          foreach ($path in @('tools/pw-local-test.ps1','tools/pw-prepare-d3dx.ps1','tools/pw-prepare-steam-imports.ps1')) {
            $tokens=$null
            $errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Invalid PowerShell syntax: $path"
            }
            Write-Host "Syntax checked $path"
          }
          if (-not (Test-Path 'START_PW_TEST_BUILD.cmd')) { throw 'Missing local launcher' }
          $script=Get-Content 'tools/pw-local-test.ps1' -Raw
          if ($script -notmatch 'PW-TestInstall' -or $script -notmatch 'outside SteamGameDir' -or
              $script -notmatch 'repository or PW-Build' -or $script -notmatch 'SHA256' -or
              $script -notmatch 'PW Edition branding marker') {
            throw 'Missing test install isolation or built-output integrity checks'
          }
          Write-Host 'Local build script syntax and output guards verified. No GameGuru EXE built, copied or run.'
      - name: Reject destructive destination paths before building or copying assets
        shell: pwsh
        run: |
          # Use synthetic empty placeholders, never actual licensed Steam media.
          $fake = Join-Path $env:RUNNER_TEMP ('pw-synthetic-steam-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $fake 'Files') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fake 'GameGuru.exe') -Value 'Not a real GameGuru binary'
          $checkout = (Resolve-Path .).Path
          $blocked = @($fake, $checkout, (Join-Path $checkout 'tools'), (Join-Path $checkout 'PW-Build'))
          try {
            foreach ($target in $blocked) {
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.\tools\pw-local-test.ps1' -SteamGameDir $fake -TestDir $target -SkipBuild *> $null
              if ($LASTEXITCODE -eq 0) { throw "Unsafe TestDir was accepted: $target" }
            }
            if (-not (Test-Path -LiteralPath (Join-Path $fake 'GameGuru.exe'))) {
              throw 'Synthetic Steam source disappeared'
            }
            # The last expected rejection leaves LASTEXITCODE=1; clear it after assertions.
            $global:LASTEXITCODE = 0
            Write-Host 'Dangerous test destinations were rejected before build/copy.'
          } finally {
            Remove-Item -LiteralPath $fake -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Validate Steam import-link metadata with MSVC
        shell: pwsh
        run: |
          ./tools/pw-prepare-steam-imports.ps1
          $folder = 'GameGuru Core/SDK/Steamworks SDK/redistributable_bin/win64'
          foreach ($name in @('steam_api64.lib','sdkencryptedappticket64.lib')) {
            $lib = Join-Path $folder $name
            if (-not (Test-Path $lib)) { throw "Expected symbol import library missing: $lib" }
            if ((Get-Item $lib).Length -lt 128) { throw "Unexpected short Steam import library: $lib" }
          }
          Write-Host "Steam import-link metadata generated; no Steam DLL or SDK binary was downloaded."
